[package]
name = "fableforge"
version = "0.1.0"
edition = "2021"
description = "FableForge — suite nativa de escritura creativa y mapas"
license = "MIT OR Apache-2.0"
authors = ["FableForge"]

[[bin]]
name = "FableForge"
path = "src/main.rs"

[dependencies]
egui = "0.37"
eframe = { version = "0.37", default-features = true, features = ["persistence"] }
egui_extras = { version = "0.37", default-features = true, features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
sys-locale = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.18"
dirs = "7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
